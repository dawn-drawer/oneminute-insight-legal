name: Apply AI transparency legal patch

on:
  push:
    branches:
      - audit/ai-transparency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/ai-transparency
          fetch-depth: 0

      - name: Apply targeted Terms patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('terms.html')
          text = path.read_text()

          replacements = [
              (
                  'Last updated: August 25, 2026',
                  'Last updated: September 9, 2026',
              ),
              (
                  'Artificial-intelligence tools may assist with drafting, reviewing, or structuring OneSpark’s own editorial content.',
                  'Generative AI tools are used to create and review OneSpark Brief, Quiz, and Mission content, including drafting, reviewing, or structuring OneSpark’s own editorial text.',
              ),
              (
                  'OneSpark uses artificial-intelligence tools as part of its editorial workflow. AI-assisted content can contain mistakes, omissions, outdated information, or bias even when review steps are used. Current-events information can also change after an insight is generated.',
                  'OneSpark uses generative artificial-intelligence tools to create and review Brief, Quiz, and Mission content as part of its editorial workflow. AI-generated results are identified in the Service so users can recognize that generative AI was used to create them. AI-assisted content can contain mistakes, omissions, outdated information, or bias even when review steps are used. Current-events information can also change after an insight is generated.',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Remove one-off patch workflow and commit
        shell: bash
        run: |
          rm .github/workflows/_audit_ai_transparency_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clarify generative AI transparency terms"
          git push origin HEAD:audit/ai-transparency
