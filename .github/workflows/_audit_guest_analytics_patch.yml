name: Align Privacy Policy with Guest analytics policy

on:
  push:
    branches:
      - audit/posthog-overseas-consent

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/posthog-overseas-consent
          fetch-depth: 0

      - name: Apply targeted Guest analytics policy patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('privacy.html')
          text = p.read_text()

          def replace_once(old: str, new: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:140]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '''<li><strong>Product Analytics is optional.</strong> Product Analytics is not enabled by the introductory product-onboarding screens. After you sign in, or after you choose Continue as Guest, OneSpark presents Privacy choices that separate the required Terms/Privacy/age confirmation from the optional Product Analytics choice. PostHog remains off unless you affirmatively enable that optional choice. Declining or later disabling Product Analytics does not prevent you from using OneSpark.</li>''',
              '''<li><strong>Product Analytics is optional and account-scoped.</strong> Product Analytics is not enabled by the introductory product-onboarding screens. After you sign in, OneSpark presents Privacy choices that separate the required Terms/Privacy/age confirmation from the optional Product Analytics &amp; Overseas Transfer choice. PostHog remains off unless a signed-in user affirmatively enables that optional choice. <strong>Guest mode does not send OneSpark product-analytics events to PostHog.</strong> Declining or later disabling Product Analytics does not prevent you from using OneSpark.</li>''',
          )
          replace_once(
              '''<li><strong>Consent scope:</strong> for a signed-in user, the legal acknowledgement and Product Analytics preference are stored for that specific OneSpark account and are checked again when that account signs in. One account’s choice is not silently attributed to another account that later uses the same device. Guest-mode choices have no account to attach to and therefore remain stored locally for that app installation/device context.</li>''',
              '''<li><strong>Consent scope:</strong> for a signed-in user, the legal acknowledgement and Product Analytics preference are stored for that specific OneSpark account and are checked again when that account signs in. One account’s choice is not silently attributed to another account that later uses the same device. In Guest mode, only the required legal acknowledgement is stored locally for that app installation/device context; Product Analytics remains disabled.</li>''',
          )
          replace_once(
              '''<li>You may withdraw the optional analytics choice at any time from the in-app Terms &amp; Privacy screen. For a signed-in account, the updated choice is saved to that account; for Guest mode, it is saved locally. After an effective opt-out, OneSpark stops future PostHog product-event capture and future optional analytics transfers for the active consent scope. Disabling Product Analytics does not by itself erase analytics data already lawfully processed; account deletion or a verified erasure request triggers the applicable provider-deletion process, subject to provider processing time and any legally required retention.</li>''',
              '''<li>A signed-in user may withdraw the optional analytics choice at any time from the in-app Terms &amp; Privacy screen, and the updated choice is saved to that account. Guest mode keeps Product Analytics disabled. After an effective signed-in opt-out, OneSpark stops future PostHog product-event capture and future optional analytics transfers for that account. Disabling Product Analytics does not by itself erase analytics data already lawfully processed; account deletion or a verified erasure request triggers the applicable provider-deletion process, subject to provider processing time and any legally required retention.</li>''',
          )
          replace_once(
              '''<li><strong>Data transferred:</strong> a pseudonymous OneSpark account identifier for signed-in users and limited product-usage events. Guest analytics use the local Guest/device consent scope and are not intentionally linked to an account email or name.</li>''',
              '''<li><strong>Data transferred:</strong> a pseudonymous OneSpark account identifier and limited product-usage events for a signed-in user who affirmatively enables Product Analytics. Guest mode does not send OneSpark product-analytics events to PostHog.</li>''',
          )
          replace_once(
              '''<li><strong>Retention / deletion:</strong> previously collected analytics may remain while the OneSpark account is active until account deletion, a verified erasure request, or applicable provider retention/deletion rules remove them. Disabling Product Analytics stops future capture and transfer but does not by itself erase analytics already processed. Provider-side privacy deletion may complete asynchronously after an accepted deletion request.</li>''',
              '''<li><strong>Retention / deletion:</strong> previously collected signed-in analytics may remain while the OneSpark account is active until account deletion, a verified erasure request, or applicable provider retention/deletion rules remove them. Disabling Product Analytics stops future capture and transfer but does not by itself erase analytics already processed. Provider-side privacy deletion may complete asynchronously after an accepted deletion request.</li>''',
          )
          replace_once(
              '''For optional PostHog Product Analytics, you can refuse the choice when OneSpark presents the post-login or Guest Privacy choices, or withdraw it later from the in-app Terms &amp; Privacy screen; doing so does not prevent use of OneSpark.''',
              '''For optional PostHog Product Analytics, a signed-in user can refuse the choice when OneSpark presents the post-login Privacy choices or withdraw it later from the in-app Terms &amp; Privacy screen; doing so does not prevent use of OneSpark. Guest mode keeps Product Analytics disabled and therefore makes no optional PostHog product-analytics transfer.''',
          )

          p.write_text(text)
          PY

      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          rm .github/workflows/_audit_guest_analytics_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Keep Guest product analytics disabled"
          git push origin HEAD:audit/posthog-overseas-consent
