name: Apply legal dark mode patch

on:
  push:
    branches:
      - ui/legal-dark-mode

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/legal-dark-mode
          fetch-depth: 0

      - name: Add automatic light and dark mode styles
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('terms.html'),
              Path('privacy.html'),
              Path('delete-account.html'),
          ]

          dark_css = """
              :root { color-scheme: light dark; }
              @media (prefers-color-scheme: dark) {
                body {
                  color: #e9edf5;
                  background-color: #0f1115;
                }
                h1, h2, h3 { color: #f7f8fa; }
                a { color: #8ab4f8; }
                hr { border-top-color: #343a46; }
                small { color: #aeb6c2; }
                .highlight-box,
                .note {
                  background-color: #1b2028;
                  border-left-color: #76839a;
                }
                .card {
                  background: #171a21;
                  border-color: #343a46;
                }
                table { color: #e9edf5; }
                th, td { border-color: #39414e; }
                th { background: #202631; }
                .primary-link {
                  background: #8fb1ff;
                  color: #111827;
                }
              }
          """

          for path in files:
              text = path.read_text(encoding='utf-8')
              if 'prefers-color-scheme: dark' in text:
                  raise SystemExit(f'{path}: dark-mode CSS already exists')
              if '  </style>' not in text:
                  raise SystemExit(f'{path}: </style> anchor missing')
              text = text.replace('  </style>', dark_css + '  </style>', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify intended HTML changes
        run: |
          git diff --check
          grep -q 'prefers-color-scheme: dark' terms.html
          grep -q 'prefers-color-scheme: dark' privacy.html
          grep -q 'prefers-color-scheme: dark' delete-account.html

      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/_apply_legal_dark_mode.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add terms.html privacy.html delete-account.html .github/workflows/_apply_legal_dark_mode.yml
          git commit -m 'Support automatic dark mode on legal pages'
          git push origin HEAD:ui/legal-dark-mode
