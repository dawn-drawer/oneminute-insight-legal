name: Apply PostHog overseas consent legal patch

on:
  push:
    branches:
      - audit/posthog-overseas-consent

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/posthog-overseas-consent
          fetch-depth: 0

      - name: Apply targeted Privacy Policy patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('privacy.html')
          text = path.read_text()

          def replace_once(old: str, new: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'Last updated: September 8, 2026',
              'Last updated: September 9, 2026',
          )
          replace_once(
              'After an effective opt-out, OneSpark stops future PostHog product-event capture for the active consent scope, subject to data already lawfully processed and applicable retention requirements.',
              'After an effective opt-out, OneSpark stops future PostHog product-event capture and future optional analytics transfers for the active consent scope. Disabling Product Analytics does not by itself erase analytics data already lawfully processed; account deletion or a verified erasure request triggers the applicable provider-deletion process, subject to provider processing time and any legally required retention.',
          )
          replace_once(
              '<td>Production is configured for PostHog EU Cloud.</td>',
              '<td>Germany (EU; PostHog EU Cloud, Frankfurt).</td>',
          )
          replace_once(
              '<td>According to our configured analytics retention; you may disable future capture at any time in the app, and account deletion requests deletion of the matched person and associated events/recordings as described in Section 6.</td>',
              '<td>Previously collected analytics may remain while the OneSpark account is active until account deletion, a verified erasure request, or applicable provider retention/deletion rules remove them. Disabling Product Analytics stops future capture and transfer but does not by itself erase analytics already processed. Account deletion requests deletion of the matched person and associated events/recordings as described in Section 6.</td>',
          )
          replace_once(
              '<td>Optional overseas processing for limited product analytics. OneSpark does not treat acknowledgement of this Privacy Policy as consent to this transfer. Where consent is the applicable basis, the transfer begins only after the separate affirmative Product Analytics choice is enabled, and that choice can be withdrawn in the app without preventing use of OneSpark.</td>',
              '<td>Optional overseas processing for limited product analytics. OneSpark does not treat acknowledgement of this Privacy Policy as consent to this transfer. Where consent is the applicable basis, the transfer begins only after the separate affirmative Product Analytics &amp; Overseas Transfer choice is enabled. The pre-transfer choice states the transferred data categories, PostHog recipient/contact, Germany destination, transfer timing/method, purpose, retention/deletion conditions, and refusal effect. The choice can be refused or withdrawn without preventing use of OneSpark.</td>',
          )

          anchor = '''</table>\n\n<h3>7.2 Refusing or Withdrawing an Overseas Transfer</h3>'''
          details = '''</table>\n\n<h3>7.1.1 Optional PostHog Product Analytics Transfer</h3>\n<p>\n  Before optional PostHog analytics transfer begins, OneSpark presents a separate affirmative choice with the following information:\n</p>\n<ul>\n  <li><strong>Data transferred:</strong> a pseudonymous OneSpark account identifier for signed-in users and limited product-usage events. Guest analytics use the local Guest/device consent scope and are not intentionally linked to an account email or name.</li>\n  <li><strong>Recipient and contact:</strong> PostHog, Inc.; <a href="mailto:privacy@posthog.com">privacy@posthog.com</a>.</li>\n  <li><strong>Destination:</strong> Germany (EU), using OneSpark’s PostHog EU Cloud project in Frankfurt.</li>\n  <li><strong>Timing and method:</strong> only after the user affirmatively enables the optional choice, when qualifying product events occur, through encrypted network connections.</li>\n  <li><strong>Purpose:</strong> product analytics and service improvement. The data is not used by OneSpark for targeted advertising or personalized news.</li>\n  <li><strong>Retention / deletion:</strong> previously collected analytics may remain while the OneSpark account is active until account deletion, a verified erasure request, or applicable provider retention/deletion rules remove them. Disabling Product Analytics stops future capture and transfer but does not by itself erase analytics already processed. Provider-side privacy deletion may complete asynchronously after an accepted deletion request.</li>\n  <li><strong>Refusal / withdrawal effect:</strong> the choice is optional. Leaving it off or disabling it later does not prevent use of OneSpark.</li>\n</ul>\n\n<h3>7.2 Refusing or Withdrawing an Overseas Transfer</h3>'''
          count = text.count(anchor)
          if count != 1:
              raise SystemExit(f'Expected one Section 7.2 anchor, found {count}')
          text = text.replace(anchor, details, 1)

          path.write_text(text)
          PY

      - name: Remove one-off patch workflow and commit
        shell: bash
        run: |
          rm .github/workflows/_audit_posthog_consent_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clarify PostHog overseas transfer consent"
          git push origin HEAD:audit/posthog-overseas-consent
